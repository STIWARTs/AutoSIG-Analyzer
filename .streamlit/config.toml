[theme]
# Single fixed theme: base = "light" and NO [theme.light]/[theme.dark] sections.
# Defining both sections would add a Light/Dark toggle to every visitor's
# settings menu; that toggle is stored in browser localStorage, so each browser
# could show a different native theme while our server-side CSS tokens (see
# app/components/theme.py) follow only this file — the mismatch that broke the
# deployed app's styling. With one flat theme, native widgets and custom CSS
# always agree locally and on Streamlit Cloud.
base = "light"
primaryColor = "#3E92CC"
font = "sans serif"
backgroundColor = "#F7F9FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2733"

[theme.sidebar]
backgroundColor = "#EDF1F5"

[server]
maxUploadSize = 200

[client]
showSidebarNavigation = false
